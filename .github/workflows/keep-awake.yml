name: Keep API awake

# Render's free plan puts the API to sleep after 15 idle minutes; the next click then waits ~30 s.
# This asks the API for its health page every 10 minutes during working hours
# (08:00-20:30 India time, Monday-Saturday) so it stays awake while people use it.
# Working hours only: Render's free plan gives 750 running hours a month for the whole Render workspace.

on:
  schedule:
    - cron: '*/10 2-14 * * 1-6' # UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API for its health page
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://growspark-project-management.onrender.com/api/health \
            || echo "API did not answer (it may be redeploying); the next run tries again"
