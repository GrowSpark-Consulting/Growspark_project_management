name: Deadline reminders

# Every morning (08:00 India time) the API sends each person a notification for their tasks that are
# due tomorrow, due today or overdue. Safe to run again: a person gets each reminder once per day.
# Needs the repository secret CRON_SECRET (the same value as CRON_SECRET on Render).

on:
  schedule:
    - cron: '30 2 * * *' # UTC
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the API to send today's reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Retries cover the API waking from sleep (about 30 s) or redeploying
          curl -fsS -X POST --max-time 120 --retry 4 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://growspark-project-management.onrender.com/api/cron/deadline-reminders
          echo
