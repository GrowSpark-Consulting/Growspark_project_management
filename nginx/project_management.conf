# This file is included inside the nginx `http {}` block (sites-enabled),
# so the limit_req_zone lines below are valid here.

# Free, built-in rate limiting (SEC-20). Works without Upstash/Redis.
#  - auth: login/signup/invite/password endpoints
#  - api:  all other API calls
limit_req_zone $binary_remote_addr zone=pm_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pm_api:10m  rate=20r/s;

server {
    listen 80;
    server_name _;

    # HTTPS (SEC-19): once a domain points at this server, run the free Let's Encrypt client:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d your-domain.com
    # certbot adds `listen 443 ssl` + certificates and an HTTP->HTTPS redirect to this file.

    # Uploads: the app accepts files up to 10 MB (project-files bucket).
    client_max_body_size 12m;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Auth-sensitive endpoints: strict rate limit
    location ~ ^/(api/auth|api/invitations|api/client/accept-invite|auth/|supabase/auth/v1/(token|signup|recover|otp)) {
        limit_req zone=pm_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes: general rate limit
    location /api/ {
        limit_req zone=pm_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Next.js application
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Supabase API — proxied so browser talks to same origin (no CORS/CSP issues)
    # (Only used with a self-hosted/local Supabase. With hosted Supabase this block is unused.)
    location /supabase/ {
        rewrite ^/supabase/(.*) /$1 break;
        proxy_pass http://127.0.0.1:54321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # CRITICAL: Rewrite cookie paths from Supabase
        # Supabase sets cookies with Path=/ but through the proxy they need
        # to be accessible on all paths so Next.js API routes can read them
        proxy_cookie_path / /;
    }

    # SEC-17 / SEC-18: Supabase Studio (/studio/) and the mail catcher (/mail/) are NO LONGER
    # exposed publicly. Studio has full database access with no login. To use them, open an
    # SSH tunnel from your own computer instead:
    #   ssh -L 54323:127.0.0.1:54323 -L 54324:127.0.0.1:54324 user@your-server
    # then browse http://localhost:54323 (Studio) or http://localhost:54324 (mail).
}
